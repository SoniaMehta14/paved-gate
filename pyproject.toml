[project]
name = "paved-gate"
version = "0.1.0"
description = "A fast System 1 ingestion gate for AI agent architectures: typed safety, routing, and necessity checks in ~100ms before anything reaches a frontier model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sonia Mehta" }]
keywords = ["ai-safety", "guardrails", "llm", "middleware", "policy-as-code", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "uvicorn>=0.30"]
anthropic = ["anthropic>=1,<2"]
openai = ["openai>=1.40"]
all = ["paved-gate[fastapi,anthropic,openai]"]
eval = [
    "scikit-learn>=1.5",
]
openshell = [
    "grpcio>=1.76",
    "protobuf>=6.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.5",
    "grpcio>=1.76",
    "protobuf>=6.31",
    "grpcio-tools>=1.76",
    "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paved_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".", "scripts", "evals/support_tickets"]

[tool.mypy]
strict = true
python_version = "3.12"  # numpy (via scikit-learn) ships 3.12-syntax stubs; runtime still supports 3.11
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# protoc-generated code (scripts/gen_openshell_stubs.sh); typed via the generated .pyi files
module = ["paved_gate.integrations.openshell._gen.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/paved_gate/integrations/openshell/_gen"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
